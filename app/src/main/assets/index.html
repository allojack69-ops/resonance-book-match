<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Резонанс / Book Match</title>
<style>
:root{--bg:#f5f3ef;--text:#171717;--muted:#706b65;--line:#ded9d1;--soft:#eeeae3;--card:#fff}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:auto;padding:20px 16px 50px}.brand{font-size:15px;font-weight:800;letter-spacing:.06em;margin:8px 0 24px}.card{background:var(--card);border-radius:24px;padding:26px;margin:14px 0;box-shadow:0 2px 12px #0001}h1{margin:0 0 8px;font-size:31px;line-height:1.1}h2{margin:0 0 14px}.muted{color:var(--muted);line-height:1.45}.bar{height:7px;background:#e6e2dc;border-radius:9px;overflow:hidden;margin:18px 0 28px}.fill{height:100%;background:var(--text)}.q{font-size:22px;line-height:1.38;margin:24px 0}.opt{display:block;width:100%;padding:17px 18px;margin:10px 0;border:1px solid var(--line);border-radius:16px;background:#fff;text-align:left;font-size:17px;cursor:pointer;color:var(--text);-webkit-tap-highlight-color:transparent}.opt.sel,.opt:hover{background:var(--text);color:#fff}.primary{border:0;border-radius:16px;background:var(--text);color:#fff;padding:15px 20px;font-size:17px;font-weight:700;cursor:pointer}.secondary{border:1px solid var(--line);border-radius:16px;background:var(--soft);color:var(--text);padding:15px 20px;font-size:17px;font-weight:700;cursor:pointer}.tag{display:inline-block;background:var(--soft);border-radius:20px;padding:7px 10px;margin:3px;font-size:13px}.book{border-top:1px solid #e3ded7;padding:22px 0}.title{font-size:22px;font-weight:750}.author{color:var(--muted);margin-top:4px}.desc{line-height:1.45;margin:10px 0 14px}.score{font-weight:700;margin-top:8px}.pill{display:inline-block;padding:6px 9px;border-radius:12px;background:var(--soft);font-size:12px;font-weight:800;letter-spacing:.03em}.feedback-title{font-size:16px;font-weight:700;margin:14px 0 8px}.feedback button{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:14px;padding:11px 12px;margin:4px 4px 4px 0;font-size:15px;cursor:pointer}.feedback button.sel{background:var(--text);color:#fff}.note{background:#f2efe9;padding:14px 15px;border-radius:14px;line-height:1.45;margin:18px 0}.actions{display:flex;gap:10px;flex-wrap:wrap}.empty{padding:20px 0}.small{font-size:13px}.result-head{margin-bottom:20px}.statrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.stat{border:1px solid var(--line);border-radius:18px;padding:16px}.stat b{display:block;font-size:26px}.saved{background:#eef2eb;padding:13px 15px;border-radius:14px;margin-top:14px}.danger{color:#8b3025}
</style>
</head>
<body><div class="wrap"><div class="brand">РЕЗОНАНС / BOOK MATCH</div><div id="app"></div></div>
<script>

const STORAGE_KEY='resonance.feedback.v1';
const Q=[
["Коли герой робить складний моральний вибір, що тобі цікавіше?","Що відбувається всередині людини","До чого рішення приводить у світі","person_vs_self","choice_vs_consequence"],
["Суспільство змінює поведінку людей. Що цікавіше?","Як люди чинять опір системі","Як система сама змінює людей","person_vs_system","freedom_vs_control"],
["Герой сумнівається у власному сприйнятті реальності.","З'ясувати, що є правдою","Побачити, як це змінює героя","truth_vs_uncertainty","idea_vs_reality"],
["Повільна атмосферна книга або швидка сюжетна?","Атмосфера і глибина","Темп і події","depth_vs_pace","depth_vs_pace"],
["Автор ставить питання і не дає відповіді.","Мені подобається самому добудовувати відповідь","Хочу чіткішої позиції автора","ambiguity_vs_resolution","idea_vs_style"],
["Незвичайний світ пояснений або загадковий?","Хочу розуміти правила","Мені подобається невідомість","mystery_vs_structure","mystery_vs_structure"],
["Мета героя вимагає зміни його особистості.","Цікавить сама трансформація","Цікавить ціна мети","identity_vs_society","ethics_vs_price"],
["Одна подія має дві правди.","Цікаві різні перспективи","Хочу знайти об'єктивну правду","perspective_vs_truth","perspective_vs_truth"],
["Після книги залишається сильна думка.","Вона змінює мій погляд на реальність","Я ще довго думаю про персонажів","idea_vs_reality","person_vs_self"],
["Сильна ідея подана незвичним стилем.","Заради ідеї прийму незвичну форму","Форма не менш важлива за ідею","idea_vs_style","idea_vs_style"],
["Що сильніше утримує тебе в книзі?","Поступове розкриття сенсу","Постійна зміна подій","mystery_vs_structure","depth_vs_pace"],
["Коли фінал неоднозначний, що важливіше?","Мати простір для власного висновку","Отримати сильну, завершену відповідь","ambiguity_vs_resolution","perspective_vs_truth"]
];
const B=[
["1984","Джордж Орвелл",{"person_vs_system":1,"freedom_vs_control":1,"idea_vs_reality":.9,"identity_vs_society":1,"choice_vs_consequence":.7,"idea_vs_style":.7,"depth_vs_pace":.5,"mystery_vs_structure":.3,"ambiguity_vs_resolution":.4},"Контроль, правда, свобода та вплив системи на особистість."],
["Квіти для Елджернона","Деніел Кіз",{"person_vs_self":1,"identity_vs_society":.8,"truth_vs_uncertainty":.6,"idea_vs_reality":.8,"choice_vs_consequence":.8,"depth_vs_pace":.7,"idea_vs_style":.7,"ethics_vs_price":.7},"Трансформація людини, самоусвідомлення, стосунки та ціна зміни."],
["Майстер і Маргарита","Михайло Булгаков",{"idea_vs_reality":1,"truth_vs_uncertainty":.9,"mystery_vs_structure":.9,"perspective_vs_truth":.8,"idea_vs_style":1,"ambiguity_vs_resolution":.8,"depth_vs_pace":.7},"Реальність, мораль, свобода, абсурд і філософські питання через незвичайну форму."],
["Процес","Франц Кафка",{"person_vs_system":1,"truth_vs_uncertainty":1,"mystery_vs_structure":1,"ambiguity_vs_resolution":1,"idea_vs_reality":.8,"idea_vs_style":.8,"depth_vs_pace":.6},"Людина всередині незрозумілої системи, де правила існують, але сенс вислизає."],
["Чума","Альбер Камю",{"ethics_vs_price":1,"choice_vs_consequence":.9,"idea_vs_reality":.8,"ambiguity_vs_resolution":.8,"depth_vs_pace":.5,"person_vs_self":.6},"Моральний вибір, відповідальність і поведінка перед спільною загрозою."],
["Повелитель мух","Вільям Ґолдінґ",{"person_vs_system":.8,"identity_vs_society":1,"ethics_vs_price":1,"choice_vs_consequence":.9,"person_vs_self":.6,"freedom_vs_control":.6},"Цивілізація, влада, страх і людина без звичних правил."],
["Пікнік на узбіччі","Аркадій і Борис Стругацькі",{"truth_vs_uncertainty":1,"mystery_vs_structure":1,"idea_vs_reality":.9,"choice_vs_consequence":.7,"depth_vs_pace":.6,"ambiguity_vs_resolution":.8},"Зона з незрозумілими явищами змушує людей жити поруч із незбагненним."],
["Місто і місто","Чайна М'євіль",{"perspective_vs_truth":1,"truth_vs_uncertainty":.9,"mystery_vs_structure":1,"identity_vs_society":.8,"idea_vs_style":.8,"ambiguity_vs_resolution":.7},"Два міста існують поруч, але мешканці навчені не бачити одне одного."]
];

const PROFILE_KEY='resonance.user.profile.v2';
const LEGACY_KEY='resonance.feedback.v1';
const MAX_HISTORY=200;
let profile=null, sessionGraph={}, sessionAnswers=[], questionOrder=[], qpos=0, ratings={}, recs=[];

function uid(){return 'r_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8)}
function emptyProfile(){
  return {schema:'2.0',userId:uid(),createdAt:new Date().toISOString(),sessions:0,
    graph:{},avoidGraph:{},feedback:[],shown:[]};
}
function loadProfile(){
  let raw='';
  try{if(window.Android&&Android.getProfile) raw=Android.getProfile()||''}catch(e){}
  if(!raw){try{raw=localStorage.getItem(PROFILE_KEY)||''}catch(e){}}
  if(raw){try{profile=JSON.parse(raw)}catch(e){profile=null}}
  if(!profile){
    profile=emptyProfile();
    try{
      const legacy=JSON.parse(localStorage.getItem(LEGACY_KEY)||'[]');
      for(const s of legacy) for(const r of (s.recommendations||[])){
        const v=r.feedback&&r.feedback.value;
        if(v!==null&&v!==undefined) profile.feedback.push({legacy:true,title:r.title,value:v,mode:r.feedback.mode});
      }
    }catch(e){}
  }
  profile.graph=profile.graph||{}; profile.avoidGraph=profile.avoidGraph||{};
  profile.feedback=profile.feedback||[]; profile.shown=profile.shown||[];
  profile.sessions=Number(profile.sessions||0);
}
function persist(){
  const raw=JSON.stringify(profile);
  try{localStorage.setItem(PROFILE_KEY,raw)}catch(e){}
  try{if(window.Android&&Android.saveProfile) Android.saveProfile(raw)}catch(e){}
}
function clamp(v,min=-8,max=8){return Math.max(min,Math.min(max,v))}
function mergeGraph(base,delta,decay=.92){
  const out={...base};
  for(const [k,v] of Object.entries(delta)) out[k]=clamp((Number(out[k])||0)*decay+Number(v||0));
  return out;
}
function uncertainty(k){
  const stable=Math.abs(Number(profile.graph[k]||0));
  const avoid=Math.abs(Number(profile.avoidGraph[k]||0));
  return 1/(1+stable+avoid);
}
function chooseQuestions(){
  const scored=Q.map((q,idx)=>{
    const u=(uncertainty(q[3])+uncertainty(q[4]))/2;
    const novelty=1/(1+sessionAnswers.filter(a=>a.relation===q[3]||a.relation===q[4]).length);
    return {idx,score:u*.7+novelty*.3};
  }).sort((a,b)=>b.score-a.score);
  const limit=profile.sessions===0?Q.length:Math.min(8,Q.length);
  return scored.slice(0,limit).map(x=>x.idx);
}
function start(){
  sessionGraph={}; sessionAnswers=[]; ratings={}; recs=[]; qpos=0; questionOrder=[];
  const pool=B.slice().sort(()=>Math.random()-.5).slice(0,Math.min(12,B.length));
  window.quickBooks=pool;
  app.innerHTML=`<div class="card"><h1>Твоя карта резонансу</h1><p class="muted">Без анкет і довгих текстів. Просто відміть книги, які тобі хочеться читати.</p><div class="note">Це короткий book-first сигнал: <b>Хочу читати</b>, <b>Не знаю</b> або <b>Не хочу</b>. Граф сам відновлює пов'язані патерни.</div><div id="quickBooks">${pool.map((b,n)=>`<div class="book" id="qb-${n}"><div class="title">${b[0]}</div><div class="author">${b[1]}</div><div class="desc">${b[3]}</div><div class="actions"><button class="primary" onclick="quickRate(${n},1)">Хочу читати</button><button class="secondary" onclick="quickRate(${n},0)">Не знаю</button><button class="secondary" onclick="quickRate(${n},-1)">Не хочу</button></div></div>`).join('')}</div><button class="primary" onclick="quickFinish()">Показати резонанс</button></div>`;
}
function quickRate(n,value){
  const b=quickBooks[n], row=document.getElementById('qb-'+n);
  row.dataset.value=String(value);
  row.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));
  const buttons=row.querySelectorAll('button');
  buttons[value===1?0:value===0?1:2].classList.add('sel');
}
function quickFinish(){
  const rows=quickBooks.map((b,n)=>({b,n,value:Number(document.getElementById('qb-'+n).dataset.value||0)})).filter(x=>x.value!==0);
  if(!rows.length){alert('Відміть хоча б одну книгу.');return}
  sessionGraph={};
  for(const x of rows) for(const [k,w] of Object.entries(x.b[2]||{})){
    sessionGraph[k]=(sessionGraph[k]||0)+x.value*Number(w);
  }
  sessionAnswers=rows.map(x=>({book:x.b[0],signal:x.value}));
  result();
}
function show(){
  const idx=questionOrder[qpos], q=Q[idx];
  app.innerHTML=`<div class="card"><div class="muted">Стимул ${qpos+1} з ${questionOrder.length}</div><div class="bar"><div class="fill" style="width:${qpos/questionOrder.length*100}%"></div></div><div class="q">${q[0]}</div><button class="opt" onclick="ans(0)">${q[1]}</button><button class="opt" onclick="ans(1)">${q[2]}</button><div class="muted small" style="margin-top:16px">Можеш пропустити, якщо жоден варіант не відгукується.</div><button class="secondary" style="margin-top:8px" onclick="skip()">Жоден / пропустити</button></div>`;
}
function ans(x){
  const q=Q[questionOrder[qpos]], rel=q[3+x];
  const delta={}; delta[rel]=1;
  sessionGraph=mergeGraph(sessionGraph,delta,1);
  sessionAnswers.push({stimulus:questionOrder[qpos]+1,choice:x+1,relation:rel,skipped:false});
  qpos++; qpos<questionOrder.length?show():result();
}
function skip(){
  sessionAnswers.push({stimulus:questionOrder[qpos]+1,choice:null,relation:null,skipped:true});
  qpos++; qpos<questionOrder.length?show():result();
}
function score(b){
  let total=0,parts=[];
  for(const [k,w] of Object.entries(b[2]||{})){
    const stable=Number(profile.graph[k]||0);
    const current=Number(sessionGraph[k]||0);
    const avoid=Number(profile.avoidGraph[k]||0);
    const signal=.5+.5*Math.tanh((stable+current*.8-avoid*.6)/2);
    const hit=Number(w)*signal;
    if(hit>0){total+=hit;parts.push([k,+hit.toFixed(3)])}
  }
  return {total,parts:parts.sort((a,b)=>b[1]-a[1])};
}
function role(kind){return kind===0?'DIRECT MATCH':kind===1?'BRIDGE':'DISCOVERY'}
function selectRecommendations(){
  const ranked=B.map((b,n)=>({b,n,...score(b)})).sort((a,b)=>b.total-a.total);
  const unseen=ranked.filter(x=>!profile.shown.includes(x.n));
  const pool=unseen.length>=3?unseen:ranked;
  if(pool.length<3)return pool;
  const direct=pool[0];
  const bridge=pool[Math.min(1,pool.length-1)];
  const discovery=pool[Math.min(2,pool.length-1)];
  return [{...direct,kind:0},{...bridge,kind:1},{...discovery,kind:2}];
}
function result(){
  recs=selectRecommendations(); window.recs=recs;
  app.innerHTML=`<div class="card result-head"><h1>Твоя карта резонансу</h1><p class="muted">V2: стабільний смак, поточний стан і avoid-сигнали рахуються окремо; рекомендації використовують зв'язки графа.</p><div>${Object.entries({...profile.graph,...sessionGraph}).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1])).slice(0,8).map(([k,v])=>`<span class="tag">${k.replaceAll('_',' ')} · ${Number(v).toFixed(1)}</span>`).join('')}</div><div class="statrow"><div class="stat"><span class="muted">Сесій</span><b>${profile.sessions}</b></div><div class="stat"><span class="muted">Сигналів</span><b>${sessionAnswers.filter(a=>!a.skipped).length}</b></div></div></div><div class="card"><h2>Рекомендації</h2><p class="muted"><b>Direct match</b> — прямий резонанс. <b>Bridge</b> — спільний глибинний патерн з іншою формою. <b>Discovery</b> — контрольований вихід за межі відомого.</p>${recs.map((x,idx)=>bookCard(x,idx)).join('')}<div class="note">Для непрочитаної книги оцінюй бажання прочитати. Для прочитаної — реальне враження. Негативний сигнал окремо оновлює avoid-граф.</div><div class="actions"><button class="primary" onclick="save()">Зберегти відгук</button><button class="secondary" onclick="restart()">Нова сесія</button></div><div id="saved"></div></div>`;
}
function bookCard(x,idx){
  return `<div class="book"><span class="pill">${role(idx)}</span><div class="title" style="margin-top:10px">${x.b[0]}</div><div class="author">${x.b[1]}</div><div class="score">Прогноз резонансу · ${Math.round(Math.max(0,Math.min(1,x.total/2))*100)}%</div><div class="bar" style="margin:9px 0 12px"><div class="fill" style="width:${Math.round(Math.max(0,Math.min(1,x.total/2))*100)}%"></div></div><div class="desc">${x.b[3]}</div><div class="feedback"><div class="feedback-title">1. Ти читав цю книгу?</div><button id="unread-${x.n}" onclick="setMode(${x.n},'unread',this)">Не читав</button><button id="read-${x.n}" onclick="setMode(${x.n},'read',this)">Читав</button><div id="rate-${x.n}"></div></div></div>`;
}
const unreadOpts=[['Не цікаво',0],['Трохи цікаво',1],['Цікаво',2],['Дуже цікаво',3]];
const readOpts=[['Не сподобалась',0],['Скоріше не сподобалась',1],['Сподобалась',2],['Дуже сподобалась',3]];
function setMode(n,mode,btn){
  document.getElementById(`read-${n}`).classList.toggle('sel',mode==='read');
  document.getElementById(`unread-${n}`).classList.toggle('sel',mode==='unread');
  ratings[n]={mode,value:null}; renderRates(n,mode);
}
function renderRates(n,mode){
  const opts=mode==='read'?readOpts:unreadOpts;
  document.getElementById('rate-'+n).innerHTML=`<div class="feedback-title">2. ${mode==='read'?'Наскільки сподобалась?':'Наскільки хочеться прочитати?'}</div>`+opts.map(x=>`<button onclick="rate(${n},'${mode}',${x[1]},this)">${x[0]}</button>`).join('');
}
function rate(n,mode,v,b){
  b.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('sel')); b.classList.add('sel');
  ratings[n]={mode,value:v};
}
function applyFeedback(rec,fb){
  const signal=(Number(fb.value)-1.5)/1.5;
  const delta={};
  for(const [k,w] of Object.entries(rec.b[2]||{})){
    const d=signal*Number(w);
    if(d>=0) delta[k]=(delta[k]||0)+d;
    else profile.avoidGraph[k]=clamp((Number(profile.avoidGraph[k])||0)+(-d));
  }
  if(signal>=0) profile.graph=mergeGraph(profile.graph,delta,.92);
}
function save(){
  if(Object.keys(ratings).length<recs.length||Object.values(ratings).some(x=>x.value===null)){alert('Для кожної книги вибери «Читав / Не читав» і другу відповідь.');return}
  const feedbackRows=[];
  for(const r of recs){
    const fb=ratings[r.n];
    applyFeedback(r,fb);
    feedbackRows.push({title:r.b[0],author:r.b[1],role:role(recs.indexOf(r)),model_score:+r.total.toFixed(3),match_components:r.parts,feedback:fb});
    if(!profile.shown.includes(r.n)) profile.shown.push(r.n);
  }
  profile.shown=profile.shown.slice(-Math.max(50,B.length));
  profile.sessions++;
  profile.feedback.push({timestamp:new Date().toISOString(),session:profile.sessions,answers:sessionAnswers,recommendations:feedbackRows,graph:{...sessionGraph}});
  profile.feedback=profile.feedback.slice(-MAX_HISTORY);
  profile.graph=mergeGraph(profile.graph,sessionGraph,.92);
  persist();
  const out={product:'Resonance Book Match',version:'V2',timestamp:new Date().toISOString(),userId:profile.userId,session:profile.sessions,answers:sessionAnswers,graph:profile.graph,avoidGraph:profile.avoidGraph,recommendations:feedbackRows};
  const filename='resonance-v2-'+Date.now()+'.json';
  if(window.Android&&Android.saveJson){Android.saveJson(JSON.stringify(out,null,2),filename);document.getElementById('saved').innerHTML=`<div class="saved">V2-профіль оновлено. JSON передано Android: <b>${filename}</b></div>`}
  else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:'application/json'}));a.download=filename;a.click();document.getElementById('saved').innerHTML=`<div class="saved">V2-профіль оновлено. JSON підготовлено: <b>${filename}</b></div>`}
}
function restart(){start()}
window.onJsonSaved=function(message){const el=document.getElementById('saved');if(el)el.innerHTML=`<div class="saved">${message}</div>`}
loadProfile(); start();

</script></body></html>
